  # ---- pstack: principles ----
  # As 21 principle-* do upstream vêm como REFERENCES de uma skill só. Elas têm
  # disable-model-invocation e nunca disparam sozinhas, então 21 lugares no
  # namespace não se pagam. Três skills as citam — poteto, architect e arena —
  # logo o lugar compartilhado é uma skill, não a pasta de uma delas.
  - name: anvil-principles
    source: pstack
    pin: fdf357fae76feff7e5f2e5aaff57f99f644b55f8
    state: vendored
    path: ""                 # sem árvore própria: esta skill é só o índice + extras
    adapt: []
    keep: [SKILL.md]
    extra:
      - "skills/principle-boundary-discipline/SKILL.md::references/boundary-discipline.md"
      - "skills/principle-build-the-lever/SKILL.md::references/build-the-lever.md"
      - "skills/principle-encode-lessons-in-structure/SKILL.md::references/encode-lessons-in-structure.md"
      - "skills/principle-exhaust-the-design-space/SKILL.md::references/exhaust-the-design-space.md"
      - "skills/principle-experience-first/SKILL.md::references/experience-first.md"
      - "skills/principle-fix-root-causes/SKILL.md::references/fix-root-causes.md"
      - "skills/principle-foundational-thinking/SKILL.md::references/foundational-thinking.md"
      - "skills/principle-guard-the-context-window/SKILL.md::references/guard-the-context-window.md"
      - "skills/principle-laziness-protocol/SKILL.md::references/laziness-protocol.md"
      - "skills/principle-make-operations-idempotent/SKILL.md::references/make-operations-idempotent.md"
      - "skills/principle-migrate-callers-then-delete-legacy-apis/SKILL.md::references/migrate-callers-then-delete-legacy-apis.md"
      - "skills/principle-minimize-reader-load/SKILL.md::references/minimize-reader-load.md"
      - "skills/principle-model-the-domain/SKILL.md::references/model-the-domain.md"
      - "skills/principle-never-block-on-the-human/SKILL.md::references/never-block-on-the-human.md"
      - "skills/principle-outcome-oriented-execution/SKILL.md::references/outcome-oriented-execution.md"
      - "skills/principle-prove-it-works/SKILL.md::references/prove-it-works.md"
      - "skills/principle-redesign-from-first-principles/SKILL.md::references/redesign-from-first-principles.md"
      - "skills/principle-separate-before-serializing-shared-state/SKILL.md::references/separate-before-serializing-shared-state.md"
      - "skills/principle-sequence-verifiable-units/SKILL.md::references/sequence-verifiable-units.md"
      - "skills/principle-subtract-before-you-add/SKILL.md::references/subtract-before-you-add.md"
      - "skills/principle-type-system-discipline/SKILL.md::references/type-system-discipline.md"

