# Manifesto de curadoria do anvil.
#
# Registra de onde veio cada skill vendorizada, em que commit, e o que foi
# adaptado. O `pin` é a BASE do merge 3-way: com ele, `git show <pin>:<path>`
# reconstrói a versão de onde a cópia atual saiu, sem precisar guardar snapshot.
#
# Este arquivo NÃO vai no degit. É contrato de manutenção do repositório anvil.
#
# Operado por `.claude/skills/anvil-sync/scripts/vendor-sync.sh`.

version: 1

sources:
  mattpocock:
    submodule: references/skills
    url: https://github.com/mattpocock/skills.git
  pstack:
    submodule: references/plugins
    subpath: pstack
    url: https://github.com/cursor/plugins.git
  hallmark:
    submodule: references/hallmark
    url: https://github.com/Nutlope/hallmark.git
  taste:
    submodule: references/taste
    url: https://github.com/Leonxlnx/taste-skill.git
  payloadcms:
    submodule: references/payload-skills
    url: https://github.com/payloadcms/skills.git

# state: vendored (já no payload, com pin) | planned (ainda não copiada)
#
# adapt: regras do catálogo em ../ADAPT-RULES.md
#   rename      mecânica — o script aplica
#   docs-remap  julgamento — a skill aplica, o script sinaliza
#   decursor    julgamento — a skill aplica, o script sinaliza
#
# keep: arquivos do anvil DENTRO da skill vendorizada. O sync não os toca, não
#       tenta mesclá-los e não os apaga por não existirem upstream.
# strip: arquivos do upstream deliberadamente fora. O sync não os re-adiciona.

skills:
  # ---- payloadcms ----------------------------------------------------------
  - name: anvil-stack-payload
    source: payloadcms
    path: skills/payload
    pin: 832d5bc4258ae784f08cb7f03a3a674d6b2fa5f1
    state: vendored
    adapt: [rename]
    keep: [RULE.md, VENDOR.md, bench]

  # ---- mattpocock: fluxo principal -----------------------------------------
  - { name: anvil-grill,        source: mattpocock, path: skills/engineering/grill-with-docs,          pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-to-spec,      source: mattpocock, path: skills/engineering/to-spec,                  pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-to-tickets,   source: mattpocock, path: skills/engineering/to-tickets,               pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-implement,    source: mattpocock, path: skills/engineering/implement,                pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-code-review,  source: mattpocock, path: skills/engineering/code-review,              pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }

  # ---- mattpocock: setup e dependências ocultas ----------------------------
  - { name: anvil-setup,           source: mattpocock, path: skills/engineering/setup-matt-pocock-skills, pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-grilling,        source: mattpocock, path: skills/productivity/grilling,              pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }
  - { name: anvil-domain-modeling, source: mattpocock, path: skills/engineering/domain-modeling,        pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename, docs-remap], strip: [agents] }
  - { name: anvil-codebase-design, source: mattpocock, path: skills/engineering/codebase-design,        pin: 6654f6b60cd9d5be8b54c6fafe44346dabeb3b76, state: vendored, adapt: [rename], strip: [agents] }

  # ---- mattpocock: extras --------------------------------------------------
  - { name: anvil-wayfinder,          source: mattpocock, path: skills/engineering/wayfinder,           state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-prototype,          source: mattpocock, path: skills/engineering/prototype,           state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-research,           source: mattpocock, path: skills/engineering/research,            state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-diagnose,           source: mattpocock, path: skills/engineering/diagnosing-bugs,     state: planned, adapt: [rename, docs-remap], strip: [agents] }
  - { name: anvil-wizard,             source: mattpocock, path: skills/engineering/wizard,              state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-tdd,                source: mattpocock, path: skills/engineering/tdd,                 state: planned, adapt: [rename, docs-remap], strip: [agents] }
  - { name: anvil-grill-me,           source: mattpocock, path: skills/productivity/grill-me,           state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-handoff,            source: mattpocock, path: skills/productivity/handoff,            state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-teach,              source: mattpocock, path: skills/productivity/teach,              state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-wait-what,          source: mattpocock, path: skills/productivity/wait-what,          state: planned, adapt: [rename, docs-remap], strip: [agents] }
  - { name: anvil-writing-for-agents, source: mattpocock, path: skills/productivity/writing-for-agents, state: planned, adapt: [rename], strip: [agents] }
  - { name: anvil-to-questionnaire,   source: mattpocock, path: skills/productivity/to-questionnaire,   state: planned, adapt: [rename], strip: [agents] }

  # ---- pstack --------------------------------------------------------------
  - { name: anvil-unslop,    source: pstack, path: skills/unslop,      pin: fdf357fae76feff7e5f2e5aaff57f99f644b55f8, state: vendored, adapt: [rename] }
  - { name: anvil-how,       source: pstack, path: skills/how,         state: planned, adapt: [rename, decursor] }
  - { name: anvil-architect, source: pstack, path: skills/architect,   state: planned, adapt: [rename, decursor] }
  - { name: anvil-arena,     source: pstack, path: skills/arena,       state: planned, adapt: [rename, decursor] }
  - { name: anvil-poteto,    source: pstack, path: skills/poteto-mode, state: planned, adapt: [rename, decursor],
      strip: [scripts, references, "playbooks/autonomous-run.md", "playbooks/autopilot-full.md",
              "playbooks/autopilot-stack.md", "playbooks/babysit.md", "playbooks/eval.md",
              "playbooks/hillclimb.md", "playbooks/multi-phase-plan.md", "playbooks/opening-a-pr.md",
              "playbooks/orchestrate.md", "playbooks/perf-issue.md", "playbooks/prototype.md",
              "playbooks/runtime-forensics.md", "playbooks/trace-forensics.md",
              "playbooks/visual-parity.md", "playbooks/worktree-cleanup.md",
              "playbooks/authoring-a-skill.md"] }

  # ---- UI: métodos ---------------------------------------------------------
  - { name: anvil-ui-hallmark, source: hallmark, path: skills/hallmark,        state: planned, adapt: [rename] }
  - { name: anvil-ui-taste,    source: taste,    path: skills/taste-skill,     state: planned, adapt: [rename] }
  - { name: anvil-ui-redesign, source: taste,    path: skills/redesign-skill,  state: planned, adapt: [rename] }

  # ---- UI: presets ---------------------------------------------------------
  - { name: anvil-ui-brutalist,  source: taste, path: skills/brutalist-skill,  state: planned, adapt: [rename] }
  - { name: anvil-ui-minimalist, source: taste, path: skills/minimalist-skill, state: planned, adapt: [rename] }
  - { name: anvil-ui-soft,       source: taste, path: skills/soft-skill,       state: planned, adapt: [rename] }
  - { name: anvil-ui-stitch,     source: taste, path: skills/stitch-skill,     state: planned, adapt: [rename] }

# Skills autorais do anvil, fora do sync porque não têm upstream:
#   anvil-docs · anvil-ui (roteador) · anvil-boot · anvil-update · anvil-bench
#   tea-commit · tea-open-pr · tea-open-fast-pr · tea-prune-branches
